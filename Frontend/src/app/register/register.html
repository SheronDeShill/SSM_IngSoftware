<div class="register-container">
  <form (ngSubmit)="onSubmit()">
    <h2>Crear Cuenta</h2>

    <div>
      <label>Nombre de Usuario</label>
      <input type="text" [(ngModel)]="nuevoUsuario.nombre_usuario" name="nombre_usuario" required placeholder="Tu nombre">
    </div>
    
    <div>
      <label>Correo Electrónico</label>
      <input type="email" [(ngModel)]="nuevoUsuario.email" name="email" required placeholder="tu@correo.com">
    </div>
    
    <div>
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="nuevoUsuario.contrasena" name="contrasena" required placeholder="••••••••">
    </div>
    
    <button type="submit">Registrarse en el Sistema</button>

    <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
  </form>
</div>
