<div class="dashboard-container">
    <header class="dashboard-header">
      <h1>Panel de Administracion</h1>
      <button class="logout-btn" (click)="cerrarSesion()">Cerrar Sesion</button>
    </header>
  
    <main class="dashboard-content">
      <h2>Que deseas gestionar?</h2>
  
      <div class="botones-grid">
        <button class="card-btn" (click)="irAProductos()">
          <span class="card-icon">📦</span>
          <span class="card-title">Administrar Productos</span>
          <span class="card-desc">Registrar, editar y eliminar productos del inventario</span>
        </button>
  
        <button class="card-btn" (click)="irAUsuarios()">
          <span class="card-icon">👥</span>
          <span class="card-title">Administrar Usuarios</span>
          <span class="card-desc">Gestionar las cuentas de los vendedores</span>
        </button>
      </div>
    </main>
  </div>
