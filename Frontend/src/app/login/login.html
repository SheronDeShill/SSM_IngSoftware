<div class="login-container">
  <form (ngSubmit)="onLogin()">
    <h2>Iniciar Sesión</h2>

    <div>
      <label>Email</label>
      <input type="email" [(ngModel)]="credenciales.email" name="email" required placeholder="tu@correo.com">
    </div>
    
    <div>
      <label>Contraseña</label>
      <input type="password" [(ngModel)]="credenciales.contrasena" name="contrasena" required placeholder="••••••••">
    </div>
    
    <button type="submit">Entrar</button>

    <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
  </form>
</div>
